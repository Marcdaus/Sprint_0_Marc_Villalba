[versions]
agp = "9.4.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
material = "1.14.0"
# OJO: las claves de [versions] NO pueden llevar puntos, porque en TOML un punto crea
# una entrada anidada y Gradle lo rechaza ("entry is not a valid alias"). Por eso
# aqui es "androidxCore" y no "androidx.core". El alias de [libraries] tampoco puede
# llevar puntos, por eso el de abajo se llama "core" y no "androidx.core".
androidxCore = "1.15.0"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
# Necesaria de forma explicita: appcompat la trae como dependencia transitiva, pero
# Gradle no pone las transitivas de un "implementation" en el classpath de compilacion,
# y el codigo usa ContextCompat y ActivityCompat.
core = { group = "androidx.core", name = "core", version.ref = "androidxCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

